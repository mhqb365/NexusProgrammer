name: Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build SDK
        run: dotnet build src/RT809F.SDK.csproj --configuration Release

      - name: Build CLI
        run: dotnet build src/samples/RT809F.Cli/RT809F.Cli.csproj --configuration Release
